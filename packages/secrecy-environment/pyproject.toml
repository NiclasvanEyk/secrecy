[project]
name = "secrecy-environment"
version = "0.1.0"
description = "A secrecy driver for reading secrets from environment variables."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["secrecy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."secrecy.driver"]
environment = "secrecy_environment:driver"
