[project]
name = "secrecy-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "pick>=2.4.0",
 "pydantic>=2.9.2",
 "rich>=13.9.2",
 "secrecy",
]

[project.scripts]
secrecy = "secrecy_cli._internals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.secrecy.secrets]
modules = ["secrecy_cli.demo_secrets"]
